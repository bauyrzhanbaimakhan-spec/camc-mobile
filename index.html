<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAMC MOBILE</title>
    
    <!-- Замена буквы G на красивую иконку C -->
    <link rel="icon" type="image/png" href="https://icons8.com">
    <link rel="apple-touch-icon" href="https://icons8.com">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --camc-green: #113f2d;
            --bg-canvas: #f5f7f6;
            --white: #ffffff;
            --text-dark: #1e293b;
            --status-red: #ef4444;
            --status-green: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0; background-color: #cbd5e1;
            display: flex; justify-content: center; min-height: 100vh;
        }
        .phone-wrapper { width: 100%; max-width: 430px; background-color: var(--bg-canvas); display: flex; flex-direction: column; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
        
        /* Шапка строго по ТЗ */
        .fixed-header {
            background-color: var(--camc-green); color: var(--white);
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
        .brand-sub { font-size: 9px; color: #a7f3d0; text-transform: uppercase; }
        
        .lang-trigger {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: var(--white); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        }
        
        .app-content { flex: 1; display: flex; flex-direction: column; padding: 16px; }
        .app-screen { display: none; flex-direction: column; }
        .app-screen.active { display: flex; }
        
        .form-card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; }
        .form-title { font-size: 18px; font-weight: 700; color: var(--camc-green); margin-bottom: 20px; text-align: center; }
        .input-box { margin-bottom: 16px; }
        .input-box label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
        .input-box input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        
        .action-btn { background: var(--camc-green); color: var(--white); border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
        
        /* Виджеты */
        .user-badge { background: linear-gradient(135deg, var(--camc-green), #1e5c43); color: var(--white); padding: 16px; border-radius: 14px; margin-bottom: 16px; }
        .user-badge h3 { margin: 0 0 4px 0; font-size: 16px; }
        .user-badge p { margin: 0; font-size: 12px; opacity: 0.85; }
        
        .system-alert { background: var(--white); border-left: 4px solid var(--status-green); border-radius: 8px; padding: 12px; font-size: 12px; margin-bottom: 14px; }
        
        .sys-box-blink {
            background-color: #fef2f2; border: 2px solid var(--status-red); border-radius: 8px;
            padding: 12px; font-size: 12px; text-align: center; font-weight: 700;
            animation: appBlink 2s infinite alternate; margin-bottom: 14px;
        }
        @keyframes appBlink {
            0% { border-color: var(--status-red); color: var(--status-red); }
            100% { border-color: var(--status-green); color: var(--status-green); }
        }

        .modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .module-tile { background: var(--white); border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; text-align: center; font-size: 12px; font-weight: 700; }
        
        .network-pill { text-align: center; font-size: 11px; font-weight: 700; padding: 8px; border-radius: 20px; margin-bottom: 12px; transition: 0.3s; }
        .network-pill.online { background: #dcfce7; color: #15803d; }
        .network-pill.offline { background: #fee2e2; color: #b91c1c; }
        
        .qr-trigger { width: 72px; height: 72px; background: #fae8ff; border: 2px dashed #a855f7; border-radius: 50%; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #7e22ce; font-weight: 800; font-size: 11px; margin: 15px auto; }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <div class="fixed-header">
        <div>
            <div class="brand-title">CAMC MOBILE</div>
            <div class="brand-sub">Central Asia Mining Co.</div>
        </div>
        <button class="lang-trigger" id="langNode" onclick="rotateLanguage()">РУС</button>
    </div>

    <div class="app-content">
        <!-- Индикатор связи динамически меняется -->
        <div id="netStatusNode" class="network-pill online">РЕЖИМ СВЯЗИ: ОНЛАЙН</div>

        <!-- ЭКРАН ВХОДА -->
        <div id="screenGate" class="app-screen active">
            <div class="form-card">
                <div class="form-title" id="lblAuthTitle">Авторизация</div>
                <div class="input-box">
                    <label id="lblFioInput">Введите ФИО как в удостоверении или паспорте</label>
                    <input type="text" id="gateFioInput" placeholder="Иванов Иван Иванович">
                </div>
                <div class="input-box">
                    <label id="lblPinInput">Введите PIN-код (4 цифры)</label>
                    <input type="password" id="gatePinInput" placeholder="••••" maxlength="4">
                </div>
                <button class="action-btn" onclick="submitAuth()" id="btnSignIn">Войти в систему</button>
            </div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="screenDashboard" class="app-screen">
            <div class="user-badge">
                <h3 id="dashFio">ФИО</h3>
                <p id="dashMeta">Должность</p>
            </div>
            <div class="system-alert">
                <b id="lblAnn">Уведомление:</b><br>
                <span id="lblAnnText">Система CAMC MOBILE запущена. Все данные защищены.</span>
            </div>
            <div class="sys-box-blink" id="lblBlinkBox">Квадрат моргает зеленым и красным</div>
            
            <div style="text-align:center;"><div class="qr-trigger" onclick="alert('Сканирование...')"><span>СКАН</span><b>QR</b></div></div>
            
            <div style="font-size:11px; text-transform:uppercase; font-weight:700; color:#64748b; margin-bottom:10px;" id="lblYourMods">Ваши модули</div>
            <div class="modules-grid" id="dashboardModulesGrid"></div>
            <button class="action-btn" style="background:#64748b; margin-top:24px;" onclick="location.reload()" id="btnExit">Выйти</button>
        </div>
    </div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT
    const CONFIG_BACKEND_URL = https://script.google.com/macros/s/AKfycbwsrTDDq4E4u2YlqPcOKyJl0cbUZEpEw3sFiSmAZAjtkuC09UZaoswXi1UXQGI7VssA/exec;

    const DICTIONARY = {
        RU: { authTitle: "Авторизация", fioLbl: "Введите ФИО как в удостоверении или паспорте", pinLbl: "Введите PIN-код (4 цифры)", btnIn: "Войти в систему", netOn: "РЕЖИМ СВЯЗИ: ОНЛАЙН", netOff: "РЕЖИМ СВЯЗИ: АВТОНОМНЫЙ РЕЖИМ", blinkText: "Квадрат моргает зеленым и красным", yourMods: "Ваши модули", exit: "Выйти", ann: "Уведомление:", annTxt: "Система CAMC MOBILE запущена. Все данные защищены." },
        KK: { authTitle: "Авторизация", fioLbl: "АЖТ-ны куәліктегідей енгізіңіз", pinLbl: "PIN-кодты енгізіңіз (4 цифр)", btnIn: "Жүйеге кіру", netOn: "БАЙЛАНЫС РЕЖИМІ: ОНЛАЙН", netOff: "БАЙЛАНЫС РЕЖИМІ: АВТОНОМДЫ РЕЖИМ", blinkText: "Шаршы жасыл және қызыл түспен жыпылықтайды", yourMods: "Сіздің модульдеріңіз", exit: "Шығу", ann: "Хабарлама:", annTxt: "CAMC MOBILE жүйесі іске қосылды. Барлық деректер қорғалған." },
        EN: { authTitle: "Authorization", fioLbl: "Enter Full Name as in ID or passport", pinLbl: "Enter PIN code (4 digits)", btnIn: "Sign In", netOn: "NETWORK MODE: ONLINE", netOff: "NETWORK MODE: OFFLINE MODE", blinkText: "Square blinks green and red", yourMods: "Your modules", exit: "Log Out", ann: "Notification:", annTxt: "CAMC MOBILE system is running. All data secured." }
    };

    let currentLang = 'RU';
    let isOnline = true;
    let authUser = null;
    let localDb = null;

    window.addEventListener('load', () => {
        initDb();
        window.addEventListener('online', updateNet);
        window.addEventListener('offline', updateNet);
        updateNet();
    });

    function initDb() {
        const req = indexedDB.open("CamcDbV2", 1);
        req.onupgradeneeded = (e) => { e.target.result.createObjectStore("queue", { keyPath: "uuid" }); };
        req.onsuccess = (e) => { localDb = e.target.result; syncData(); };
    }

    // Автоматическое переключение индикатора сети (Второй скриншот)
    function updateNet() {
        isOnline = navigator.onLine;
        const node = document.getElementById("netStatusNode");
        if(isOnline) {
            node.className = "network-pill online";
            node.innerText = DICTIONARY[currentLang].netOn;
            syncData();
        } else {
            node.className = "network-pill offline";
            node.innerText = DICTIONARY[currentLang].netOff;
        }
    }

    // Мгновенная смена ВСЕХ слов на экране при клике (Второй скриншот)
    function rotateLanguage() {
        const order = ['RU', 'KK', 'EN'];
        currentLang = order[(order.indexOf(currentLang) + 1) % order.length];
        document.getElementById("langNode").innerText = currentLang;
